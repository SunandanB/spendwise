<!DOCTYPE html>
<html><head><title>SpendWise Logic Tests</title>
<style>
  body { font-family: monospace; background: #0a0e1a; color: #e2e8f0; padding: 20px; }
  .pass { color: #34d399; } .fail { color: #ef4444; font-weight: bold; }
  h3 { color: #22d3ee; margin-top: 24px; }
  pre { white-space: pre-wrap; font-size: 12px; line-height: 1.7; }
</style>
</head>
<body>
<h2>SpendWise — Automated Tests</h2>
<pre id="output"></pre>
<script>
const out = document.getElementById('output');
let passed = 0, failed = 0;

function log(msg) { out.textContent += msg + '\n'; }
function assert(desc, condition) {
  if (condition) { log(`  ✅ ${desc}`); passed++; }
  else { log(`  ❌ FAIL: ${desc}`); failed++; }
}

// ─── Inline the smartParseDate function exactly as in updated app.js ───
function smartParseDate(dateStr) {
  if (!dateStr) return null;
  let s = String(dateStr).trim();
  s = s.replace(/[a-zA-Z!@#$%^&*()_\[\]{}|\\;'"<>?]+$/, '').trim();
  s = s.replace(/^(\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{4})\d+$/, '$1');
  if (!s) return null;

  if (/^\d{4,5}(\.\d+)?$/.test(s)) {
    const serial = parseFloat(s);
    if (serial > 30000 && serial < 60000) {
      const excelEpoch = new Date(1899, 11, 30);
      const d = new Date(excelEpoch.getTime() + serial * 86400000);
      if (!isNaN(d.getTime()) && d.getFullYear() > 1990) return d;
    }
  }

  const dmy = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (dmy) {
    let [, day, month, year] = dmy;
    day = parseInt(day); month = parseInt(month); year = parseInt(year);
    if (year < 100) year += 2000;
    if (month > 12 && day <= 12) { [day, month] = [month, day]; }
    if (day >= 1 && day <= 31 && month >= 1 && month <= 12) {
      const d = new Date(year, month - 1, day);
      if (!isNaN(d.getTime())) return d;
    }
  }

  const iso = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if (iso) {
    const [, year, month, day] = iso;
    const d = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
    if (!isNaN(d.getTime())) return d;
  }

  const dMonY = s.match(/^(\d{1,2})[\-\s]([A-Za-z]{3,})[\-\s](\d{2,4})$/);
  if (dMonY) {
    let [, day, mon, year] = dMonY;
    if (year.length === 2) year = '20' + year;
    const d = new Date(`${mon} ${day}, ${year}`);
    if (!isNaN(d.getTime())) return d;
  }

  const monDY = s.match(/^([A-Za-z]{3,})\s+(\d{1,2}),?\s+(\d{4})$/);
  if (monDY) { const d = new Date(s); if (!isNaN(d.getTime())) return d; }

  const d = new Date(s);
  if (!isNaN(d.getTime()) && d.getFullYear() > 1990) return d;
  return null;
}

function getPeriodMode(firstDate, lastDate) {
  const daySpan = Math.ceil((lastDate - firstDate) / (1000 * 60 * 60 * 24)) + 1;
  return daySpan > 45 ? 'monthly' : 'weekly';
}

// ══════════════ TEST 1: DD/MM/YYYY ══════════════
log('═══ TEST 1: DD/MM/YYYY (Indian format) ═══');
let d = smartParseDate('01/09/2026');
assert('01/09/2026 → Sep 1 (not Jan 9)', d && d.getMonth() === 8 && d.getDate() === 1);
d = smartParseDate('15/09/2026');
assert('15/09/2026 → Sep 15', d && d.getMonth() === 8 && d.getDate() === 15);
d = smartParseDate('30/09/2026');
assert('30/09/2026 → Sep 30', d && d.getMonth() === 8 && d.getDate() === 30);
d = smartParseDate('01/07/2026');
assert('01/07/2026 → Jul 1', d && d.getMonth() === 6 && d.getDate() === 1);
d = smartParseDate('31/07/2026');
assert('31/07/2026 → Jul 31', d && d.getMonth() === 6 && d.getDate() === 31);

// ══════════════ TEST 2: XLS junk ══════════════
log('\n═══ TEST 2: XLS trailing characters ═══');
d = smartParseDate('02/07/2026c');
assert('02/07/2026c → Jul 2', d && d.getMonth() === 6 && d.getDate() === 2);
d = smartParseDate('03/07/2026d');
assert('03/07/2026d → Jul 3', d && d.getMonth() === 6 && d.getDate() === 3);
d = smartParseDate('04/07/2026L');
assert('04/07/2026L → Jul 4', d && d.getMonth() === 6 && d.getDate() === 4);
d = smartParseDate('26/07/20269');
assert('26/07/20269 → Jul 26 (strips trailing digit)', d && d.getMonth() === 6 && d.getDate() === 26);
d = smartParseDate('28/07/2026Z');
assert('28/07/2026Z → Jul 28', d && d.getMonth() === 6 && d.getDate() === 28);

// ══════════════ TEST 3: Other formats ══════════════
log('\n═══ TEST 3: Other date formats ═══');
d = smartParseDate('2026-09-15');
assert('2026-09-15 (ISO) → Sep 15', d && d.getMonth() === 8 && d.getDate() === 15);
d = smartParseDate('15-Sep-2026');
assert('15-Sep-2026 → Sep 15', d && d.getMonth() === 8 && d.getDate() === 15);
d = smartParseDate('15 Sep 2026');
assert('15 Sep 2026 → Sep 15', d && d.getMonth() === 8 && d.getDate() === 15);
d = smartParseDate('Sep 15, 2026');
assert('Sep 15, 2026 → Sep 15', d && d.getMonth() === 8 && d.getDate() === 15);
d = smartParseDate('01/01/26');
assert('01/01/26 (2-digit year) → Jan 1, 2026', d && d.getFullYear() === 2026 && d.getMonth() === 0);

// ══════════════ TEST 4: Period mode — one month ══════════════
log('\n═══ TEST 4: One month → weekly mode ═══');
let sept1 = smartParseDate('01/09/2026');
let sept30 = smartParseDate('30/09/2026');
assert('Sep 1-30 (30 days) → weekly', getPeriodMode(sept1, sept30) === 'weekly');

let jul1 = smartParseDate('01/07/2026');
let jul31 = smartParseDate('31/07/2026');
assert('Jul 1-31 (31 days) → weekly', getPeriodMode(jul1, jul31) === 'weekly');

// ══════════════ TEST 5: Period mode — multi-month ══════════════
log('\n═══ TEST 5: Multi-month → monthly mode ═══');
let jan1 = smartParseDate('01/01/2026');
let mar31 = smartParseDate('31/03/2026');
assert('Jan-Mar (90 days) → monthly', getPeriodMode(jan1, mar31) === 'monthly');

let jul1b = smartParseDate('01/07/2026');
let sept30b = smartParseDate('30/09/2026');
assert('Jul-Sep (92 days) → monthly', getPeriodMode(jul1b, sept30b) === 'monthly');

// ══════════════ TEST 6: Edge cases ══════════════
log('\n═══ TEST 6: Edge cases ═══');
assert('null → null', smartParseDate(null) === null);
assert('empty → null', smartParseDate('') === null);
assert('"abc" → null', smartParseDate('abc') === null);
let d45end = new Date(2026, 1, 14);
assert('45 days → weekly', getPeriodMode(new Date(2026,0,1), d45end) === 'weekly');
assert('46 days → monthly', getPeriodMode(new Date(2026,0,1), new Date(2026,1,15)) === 'monthly');

// ══════════════ TEST 7: THE BUG FIX ══════════════
log('\n═══ TEST 7: THE BUG FIX ═══');
const septDates = ['01/09/2026','05/09/2026','10/09/2026','15/09/2026','20/09/2026','25/09/2026','30/09/2026'];
const parsed = septDates.map(d => smartParseDate(d));
assert('All Sept dates → September', parsed.every(d => d && d.getMonth() === 8));
const span = Math.ceil((parsed[6] - parsed[0]) / 86400000) + 1;
assert(`Date span = ${span} days (should be 30)`, span === 30);
assert('Mode → weekly', getPeriodMode(parsed[0], parsed[6]) === 'weekly');
log(`\n  ℹ️  OLD BUG: new Date("01/09/2026") = ${new Date('01/09/2026').toDateString()} (Jan 9!)`);
log(`  ℹ️  FIXED:  smartParseDate("01/09/2026") = ${smartParseDate('01/09/2026').toDateString()} (Sep 1 ✅)`);

// ══════════════ SUMMARY ══════════════
log('\n═════════════════════════════════════');
log(`  RESULTS: ${passed} passed, ${failed} failed`);
if (failed === 0) log('  🎉 ALL TESTS PASSED!');
log('═════════════════════════════════════');
</script>
</body></html>
